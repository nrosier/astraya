# Advisory oxlint + tsgolint run (#1284). Report only: every step ends in
# `exit 0` and the job carries `continue-on-error`, so a red oxlint can never
# block a pull request. ESLint, Prettier and `tsc -b` keep gating in `ci.yml`.
#
# The owner's decision of 2026-11-07 on #1284 was "advisory CI job only": oxlint
# reports ~17x faster than ESLint locally, but the migrated config still diverges
# from ESLint on a handful of diagnostics, so it is not a gate. This job exists to
# collect Linux-CI numbers and divergences over time; it is removable in one revert
# (this file, `.oxlintrc.json`, `oxlint-plugins.js`, two devDependencies, two
# `package.json` scripts and the docs rows).
#
# Documented in docs/ops/CI.md.
name: oxlint (advisory)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oxlint-advisory-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  oxlint:
    name: oxlint and tsgolint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Belt and braces: the steps exit 0 on their own, and the job is non-blocking
    # even if a step ever stops doing so.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      # Neither the ephemeris assets nor the split corpus are needed: linting reads
      # no generated runtime data, and `src/ephemeris/generated-constants.ts` is
      # committed (and excluded from lint anyway).

      # Two runs, so oxlint's own cost and tsgolint's are reported separately:
      # `--type-aware` is what hands the type-aware rules to tsgolint.
      - name: oxlint (syntactic rules only)
        id: syntactic
        run: |
          start=$(date +%s%3N)
          npx oxlint . >oxlint-syntactic.log 2>&1 || true
          end=$(date +%s%3N)
          echo "ms=$((end - start))" >>"$GITHUB_OUTPUT"
          echo "count=$(grep -cE '^[^ ].*: (error|warning) ' oxlint-syntactic.log || true)" >>"$GITHUB_OUTPUT"
          cat oxlint-syntactic.log
          exit 0

      - name: oxlint --type-aware (oxlint + tsgolint)
        id: type_aware
        if: always()
        run: |
          start=$(date +%s%3N)
          npx oxlint --type-aware . >oxlint-type-aware.log 2>&1 || true
          end=$(date +%s%3N)
          echo "ms=$((end - start))" >>"$GITHUB_OUTPUT"
          echo "count=$(grep -cE '^[^ ].*: (error|warning) ' oxlint-type-aware.log || true)" >>"$GITHUB_OUTPUT"
          cat oxlint-type-aware.log
          exit 0

      - name: Report timings and diagnostics
        if: always()
        env:
          SYNTACTIC_MS: ${{ steps.syntactic.outputs.ms }}
          SYNTACTIC_COUNT: ${{ steps.syntactic.outputs.count }}
          TYPE_AWARE_MS: ${{ steps.type_aware.outputs.ms }}
          TYPE_AWARE_COUNT: ${{ steps.type_aware.outputs.count }}
        run: |
          oxlint_version=$(node -p "require('oxlint/package.json').version")
          tsgolint_version=$(node -p "require('oxlint-tsgolint/package.json').version")
          {
            echo '## oxlint advisory run'
            echo
            echo 'Report only: nothing here fails a pull request (#1284).'
            echo
            echo "- oxlint $oxlint_version"
            echo "- oxlint-tsgolint $tsgolint_version"
            echo
            echo '| Run | Wall clock | Diagnostics |'
            echo '| --- | ---: | ---: |'
            echo "| \`oxlint .\` (syntactic) | ${SYNTACTIC_MS} ms | ${SYNTACTIC_COUNT} |"
            echo "| \`oxlint --type-aware .\` (adds tsgolint) | ${TYPE_AWARE_MS} ms | ${TYPE_AWARE_COUNT} |"
            echo
            echo 'Compare against the gating `check` job in `ci.yml`, whose `npm run lint`'
            echo '(ESLint) and `npm run typecheck` (`tsc -b`) step durations appear in its log.'
            echo
            echo '### Diagnostics (`--type-aware`)'
            echo
            echo '```'
            if [ -s oxlint-type-aware.log ]; then cat oxlint-type-aware.log; else echo '(none)'; fi
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit 0
