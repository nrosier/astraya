# Verifies a published image by hand (run it from the Actions tab or `gh workflow run verify-image.yml`).
# It produces the evidence the signing and revision issues ask for, in a run log that stays on GitHub:
#
#   - #1209: `cosign verify` succeeds on the `latest` and the version tag, against this repository's own workflow
#     identity, and both tags resolve to the same digest.
#   - #1198: `npm run docker:smoke` builds an image whose revision label is the commit, and a plain
#     `docker build .` with no arguments still carries the label (value `unknown`).
#
# It reads and builds only: it pushes nothing and needs no secrets.
name: Verify image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to verify beside latest (for example 0.49.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  signature:
    runs-on: ubuntu-latest
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Verify the signature of latest and of the version tag
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          image="ghcr.io/${OWNER,,}/astraya"
          for tag in latest "${VERSION}"; do
            echo "::group::cosign verify ${image}:${tag}"
            cosign verify \
              --certificate-identity-regexp "^https://github.com/${REPO}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${image}:${tag}"
            echo '::endgroup::'
          done

      - name: Check that latest and the version tag are one digest
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
        run: |
          image="ghcr.io/${OWNER,,}/astraya"
          latest="$(docker buildx imagetools inspect "${image}:latest" --format '{{.Manifest.Digest}}')"
          versioned="$(docker buildx imagetools inspect "${image}:${VERSION}" --format '{{.Manifest.Digest}}')"
          echo "latest        ${latest}"
          echo "${VERSION}  ${versioned}"
          [ "${latest}" = "${versioned}" ] || { echo 'latest and the version tag differ.' >&2; exit 1; }

  revision-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: npm run docker:smoke
        run: npm run docker:smoke

      - name: The smoke image's revision label is this commit
        run: |
          label="$(docker image inspect astraya:smoke --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          echo "label ${label}"
          echo "HEAD  $(git rev-parse HEAD)"
          [ "${label}" = "$(git rev-parse HEAD)" ]

      - name: A plain docker build still carries the label, as unknown
        run: |
          docker build -t astraya:plain .
          label="$(docker image inspect astraya:plain --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          echo "label ${label}"
          [ "${label}" = "unknown" ]
