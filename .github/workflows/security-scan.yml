# Multi-engine security scan (#1279): Syft builds a CycloneDX SBOM, Grype scans
# it, Trivy cross-checks CVEs and adds secret and IaC/Dockerfile checks. Both
# engines upload SARIF to Code Scanning. Report only: nothing here fails a
# pull request. Documented in docs/ops/SECURITY-SCANS.md.
name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Syft, Grype and Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      security-events: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tool and vulnerability-DB caches (#1279). Restore runs on every run; save runs only on main, after the tools
      # have been installed. Layouts are verified in the actions' sources: anchore/sbom-action and anchore/scan-action
      # cache each tool at $RUNNER_TOOL_CACHE/<tool>/<version>/<arch> with a <arch>.complete marker, so the whole
      # <tool> directory is cached. The Grype DB root is xdg.CacheHome/grype/db (~/.cache/grype/db on the runner).
      # The DB key carries the date, so the DB refreshes each day; the scan action's own cache-db input is not used,
      # because its fixed key never refreshes.
      - name: Work out today's date for the Grype DB cache key
        id: day
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Syft tool cache
        id: syft-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/syft
          key: syft-${{ runner.os }}-${{ runner.arch }}-v1.57.0

      - name: Restore Grype tool cache
        id: grype-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/grype
          key: grype-${{ runner.os }}-${{ runner.arch }}-v0.121.2

      - name: Restore Grype vulnerability DB cache
        id: grype-db-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/grype/db
          key: grype-db-${{ runner.os }}-${{ steps.day.outputs.date }}

      # Syft (anchore/sbom-action) downloads its binary at run time, and that download
      # has failed with HTTP 504 (#1279). The same pinned action runs up to three times:
      # attempts 1 and 2 are continue-on-error, attempt 3 is not, so a download that
      # keeps failing still fails the job.
      - name: Syft SBOM (CycloneDX), attempt 1
        id: syft1
        continue-on-error: true
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.0
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Back off before Syft attempt 2
        if: steps.syft1.outcome == 'failure'
        run: |
          echo "::notice::Syft attempt 1 failed; retrying after a 2 minute backoff"
          sleep 120

      - name: Syft SBOM (CycloneDX), attempt 2
        id: syft2
        if: steps.syft1.outcome == 'failure'
        continue-on-error: true
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.0
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Back off before Syft attempt 3
        if: steps.syft1.outcome == 'failure' && steps.syft2.outcome == 'failure'
        run: |
          echo "::notice::Syft attempt 2 failed; retrying after a 5 minute backoff"
          sleep 300

      - name: Syft SBOM (CycloneDX), attempt 3
        id: syft3
        if: steps.syft1.outcome == 'failure' && steps.syft2.outcome == 'failure'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.0
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          if-no-files-found: error

      # Grype (anchore/scan-action) downloads its binary and vulnerability DB at run
      # time. HTTP 504 and a checksum mismatch after a partial download (#1279) both
      # fail the step; the retry re-runs the whole action, so the download is fetched
      # again rather than reused. Attempt 3 is not continue-on-error and fails the job.
      - name: Grype scan of the SBOM, attempt 1
        id: grype1
        if: always()
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          grype-version: v0.121.2
          sbom: sbom.cyclonedx.json
          output-format: sarif
          output-file: grype-results.sarif
          severity-cutoff: high
          fail-build: false

      - name: Back off before Grype attempt 2
        if: always() && steps.grype1.outcome == 'failure'
        run: |
          echo "::notice::Grype attempt 1 failed; retrying after a 2 minute backoff"
          rm -f grype-results.sarif
          sleep 120

      - name: Grype scan of the SBOM, attempt 2
        id: grype2
        if: always() && steps.grype1.outcome == 'failure'
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          grype-version: v0.121.2
          sbom: sbom.cyclonedx.json
          output-format: sarif
          output-file: grype-results.sarif
          severity-cutoff: high
          fail-build: false

      - name: Back off before Grype attempt 3
        if: always() && steps.grype1.outcome == 'failure' && steps.grype2.outcome == 'failure'
        run: |
          echo "::notice::Grype attempt 2 failed; retrying after a 5 minute backoff"
          rm -f grype-results.sarif
          sleep 300

      - name: Grype scan of the SBOM, attempt 3
        id: grype3
        if: always() && steps.grype1.outcome == 'failure' && steps.grype2.outcome == 'failure'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          grype-version: v0.121.2
          sbom: sbom.cyclonedx.json
          output-format: sarif
          output-file: grype-results.sarif
          severity-cutoff: high
          fail-build: false

      # Trivy (aquasecurity/trivy-action) downloads its binary and DB at run time, so it
      # gets the same three-attempt pattern. Its inputs, including exit-code: '0', are unchanged.
      - name: Trivy scan (CVE, secret, IaC and Dockerfile), attempt 1
        id: trivy1
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Back off before Trivy attempt 2
        if: always() && steps.trivy1.outcome == 'failure'
        run: |
          echo "::notice::Trivy attempt 1 failed; retrying after a 2 minute backoff"
          rm -f trivy-results.sarif
          sleep 120

      - name: Trivy scan (CVE, secret, IaC and Dockerfile), attempt 2
        id: trivy2
        if: always() && steps.trivy1.outcome == 'failure'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Back off before Trivy attempt 3
        if: always() && steps.trivy1.outcome == 'failure' && steps.trivy2.outcome == 'failure'
        run: |
          echo "::notice::Trivy attempt 2 failed; retrying after a 5 minute backoff"
          rm -f trivy-results.sarif
          sleep 300

      - name: Trivy scan (CVE, secret, IaC and Dockerfile), attempt 3
        id: trivy3
        if: always() && steps.trivy1.outcome == 'failure' && steps.trivy2.outcome == 'failure'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      # Saves run only on main, and only when the restore was not an exact hit: a hit already has the key, and
      # saving again would only log a reservation conflict. A tool directory is written only after its install
      # finishes (its .complete marker), so a failed install saves nothing usable.
      - name: Save Syft tool cache
        if: always() && github.ref == 'refs/heads/main' && steps.syft-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/syft
          key: syft-${{ runner.os }}-${{ runner.arch }}-v1.57.0

      - name: Save Grype tool cache
        if: always() && github.ref == 'refs/heads/main' && steps.grype-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/grype
          key: grype-${{ runner.os }}-${{ runner.arch }}-v0.121.2

      - name: Save Grype vulnerability DB cache
        if: always() && github.ref == 'refs/heads/main' && steps.grype-db-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/grype/db
          key: grype-db-${{ runner.os }}-${{ steps.day.outputs.date }}

      - name: Upload Grype SARIF
        if: always() && hashFiles('grype-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: grype-results.sarif
          category: grype-engine

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-engine

      - name: Count High and Critical findings
        id: count
        if: always() && github.event_name == 'schedule'
        run: |
          # A result counts when its rule's security-severity is >= 7.0 (GitHub's
          # High threshold); a result whose rule carries none counts too.
          total=0
          for f in grype-results.sarif trivy-results.sarif; do
            [ -f "$f" ] || continue
            n=$(jq '[.runs[] | (.tool.driver.rules // []) as $rules | .results[]? as $res |
              ($rules | map(select(.id == $res.ruleId)) | first // {}) as $rule |
              (($rule.properties["security-severity"] // null) | if . == null then 100 else tonumber end) |
              select(. >= 7)] | length' "$f")
            # An unparseable or empty SARIF (a scanner that failed mid-write) leaves `n` empty, which broke the sum
            # and could silently suppress the tracking issue; it counts as zero instead (#1279, verified 2026-11-07).
            echo "$f: ${n:-0}"
            total=$((total + ${n:-0}))
          done
          echo "total=$total" >> "$GITHUB_OUTPUT"

      - name: Open or update the tracking issue
        if: always() && github.event_name == 'schedule' && steps.count.outputs.total != '' && steps.count.outputs.total != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FINDINGS: ${{ steps.count.outputs.total }}
        with:
          script: |
            const title = 'Security scan: High or Critical findings';
            const label = 'risk:security';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const secUrl = `${context.serverUrl}/${owner}/${repo}/security/code-scanning`;
            const body = [
              `The scheduled security scan found ${process.env.FINDINGS} High or Critical finding(s) (Grype and Trivy combined).`,
              '',
              `- Itemised alerts: ${secUrl}`,
              `- Run: ${runUrl}`,
              '',
              'This issue is updated by the weekly scan; it is not opened twice.',
            ].join('\n');
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: label, per_page: 100,
            });
            const existing = open.find((i) => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            }
