name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes, so a fix-up push does not queue behind it (#1095).
# Pushes to main are grouped by commit, so a main run is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The changelog is drafted from commit subjects (npm run changelog:draft), so a
  # subject that does not parse is a changelog entry that silently goes missing.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check commit subjects are conventional
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          bad=0
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            if ! printf '%s' "$subject" \
              | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9#./-]+\))?!?: .+'; then
              echo "Not a conventional commit subject: $subject" >&2
              bad=1
            fi
          done < <(git log --no-merges --pretty=%s "$BASE..HEAD")
          if [ "$bad" -ne 0 ]; then
            echo 'Expected e.g. "feat(chart): draw the aspect web". See docs/ops/RELEASING.md.' >&2
            exit 1
          fi
          echo 'All commit subjects parse.'

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      # The ephemeris data files are not committed. Syncing verifies each against
      # its pinned SHA-256, so this step fails if upstream repacked the package —
      # which would mean different numbers from the same version.
      - name: Sync and verify ephemeris assets
        run: npm run ephe:sync

      # The build inlines whatever public/ contains; without this the built
      # app would 404 fetching its interpretation text.
      - name: Split corpus into runtime chunks
        run: npm run corpus:split

      # Swiss Ephemeris constants are generated from a live instance, never
      # transcribed. Drift here means the committed constants no longer match the
      # library actually being called.
      - name: Check generated constants are current
        run: node scripts/gen-constants.mjs --check

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

      # Includes the golden-chart gate: 11 bodies at 3 epochs against JPL Horizons
      # reference values, 0.2" for historical dates. Runs fully offline.
      - run: npm test

      - run: npm run build

      # Catches the main chunk silently growing, and (more importantly) catches the
      # ephemeris WASM engine losing its own chunk and landing in the main bundle (#73).
      - run: npm run check:bundle-size

  # Whether a pull request changes anything besides documentation (#1095). A docs-only pull request skips the e2e
  # shards; the required e2e check below still reports, so branch protection never waits on a check that never
  # runs. Pushes to main always run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Anything outside docs/, Markdown files and .claude/ counts as code.
          if git diff --name-only "$BASE...HEAD" | grep -qvE '^(docs/|\.claude/)|\.md$'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  # Drives a real browser against a real, locally-booted server (#72/#107) — proving
  # what the unit suite above can't: that a person's birth data actually produces a
  # rendered wheel and a real file download, and that two devices actually converge.
  # Split into five shards that run in parallel (#1095); e2e was the long pole of CI. Playwright's own `--shard` hands out
  # spec files without regard to their duration (four shards took 157, 178, 211 and 317 s), so `scripts/e2e-shard.mjs`
  # gives each shard about the same total time from the weights in `e2e/shard-weights.json`.
  e2e-shard:
    name: e2e (${{ matrix.shard }}/5)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Playwright's own image carries the browsers and their system libraries, so the job installs nothing with apt:
    # `playwright install --with-deps` stalled for over 8 minutes on one shard of PR #1245. The tag must match the
    # @playwright/test version in package-lock.json (Playwright says so, and fails, when the browser is missing).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run ephe:sync
      - run: npm run corpus:split
      # test:e2e is `npm run build && playwright test`; the shard runs the same two steps so it can pass its own spec files.
      - run: npm run build
      # The weighted split (see above) prints this shard's spec files; every spec file lands on exactly one shard.
      - run: npx playwright test $(node scripts/e2e-shard.mjs ${{ matrix.shard }} 5)
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # One stable check named e2e: it passes when every shard passed, or when a docs-only pull request skipped them.
  e2e:
    if: always()
    needs: [changes, e2e-shard]
    runs-on: ubuntu-latest
    steps:
      - name: All e2e shards passed, or none were needed
        env:
          CODE: ${{ needs.changes.outputs.code }}
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          if [ "$CODE" = false ] && [ "$SHARDS" = skipped ]; then
            echo 'Documentation-only change: e2e not needed.'
            exit 0
          fi
          test "$SHARDS" = success
